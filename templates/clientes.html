{% extends "base.html" %}

{% block titulo %}Clientes{% endblock %}

{% block contenido %}
<div class="card">
    <div class="card-body">
        <h1 class="h3">Registro de clientes</h1>

        <form action="/clientes" method="POST" id="formularioClientes">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control"
                       id="nombre" name="nombre" required>
            </div>

            <div class="mb-3">
                <label for="nit" class="form-label">NIT</label>
                <input type="text" class="form-control"
                       id="nit" name="nit" required>
            </div>

            <div class="mb-3">
                <label for="correo" class="form-label">Correo</label>
                <input type="email" class="form-control"
                       id="correo" name="correo" required>
            </div>

            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="tel" class="form-control"
                       id="telefono" name="telefono" required>
            </div>

            <div class="mb-3">
                <label for="direccion" class="form-label">Dirección</label>
                <input type="text" class="form-control"
                       id="direccion" name="direccion" required>
            </div>

            <button type="submit" class="btn btn-success">Enviar</button>
        </form>
    </div>
</div>

<div class="modal fade" id="confirmacion" tabindex="-1"
     aria-labelledby="tituloConfirmacion" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="tituloConfirmacion">
                    Confirmar envío
                </h2>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <div class="modal-body">
                ¿Deseas enviar los datos del cliente?
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    Cancelar
                </button>
                <button type="button" class="btn btn-success"
                        id="confirmarEnvio">
                    Confirmar envío
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const formulario = document.getElementById("formularioClientes");
    const ventana = new bootstrap.Modal(
        document.getElementById("confirmacion")
    );
    let confirmado = false;

    formulario.addEventListener("submit", function(evento) {
        if (!confirmado) {
            evento.preventDefault();
            ventana.show();
        }
    });

    document.getElementById("confirmarEnvio").addEventListener("click", function() {
        confirmado = true;
        formulario.requestSubmit();
    });
</script>
{% endblock %}
