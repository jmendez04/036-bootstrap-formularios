{% extends "base.html" %}

{% block titulo %}Inicio de sesión{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-body">
                <h1 class="h3 text-center">Inicio de sesión</h1>

                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label for="usuario" class="form-label">
                            Usuario
                        </label>
                        <input type="text" class="form-control"
                               id="usuario" name="usuario" required>
                    </div>

                    <div class="mb-3">
                        <label for="contrasena" class="form-label">
                            Contraseña
                        </label>
                        <input type="password" class="form-control"
                               id="contrasena" name="contrasena" required>
                    </div>

                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input"
                               id="recordarme" name="recordarme">
                        <label for="recordarme" class="form-check-label">
                            Recordarme
                        </label>
                    </div>

                    <button type="submit" class="btn btn-success">
                        Ingresar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
