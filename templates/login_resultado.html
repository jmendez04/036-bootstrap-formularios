{% extends "base.html" %}

{% block titulo %}Resultado de inicio de sesión{% endblock %}

{% block contenido %}
<h1 class="h3">Inicio de sesión</h1>

{% if acceso %}
    <div class="alert alert-success">
        Bienvenido, {{ usuario }}.
    </div>
{% else %}
    <div class="alert alert-danger">
        Usuario o contraseña incorrectos.
    </div>
{% endif %}

<a href="/login" class="btn btn-success">Volver</a>
{% endblock %}
